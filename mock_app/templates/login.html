{% extends "base.html" %}

{% block title %}Login - Internal Billing System{% endblock %}

{% block content %}
<h2 id="login-heading">User Login</h2>

<form id="login-form" action="/login" method="POST">
    <div class="form-group">
        <label for="username-input">Username</label>
        <input type="text" id="username-input" name="username" placeholder="Enter username" required autofocus>
    </div>
    
    <div class="form-group">
        <label for="password-input">Password</label>
        <input type="password" id="password-input" name="password" placeholder="Enter password" required>
    </div>
    
    <button type="submit" id="login-submit-btn" class="btn btn-primary">Log In</button>
</form>
{% endblock %}
